<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — Lusion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { jost: ['Jost', 'sans-serif'] },
          colors: {
            ink: '#2c2c2c',
            muted: '#707070',
            accent: '#fc5e48',
            line: '#ebebeb',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Jost', sans-serif; }
    .nav-link:hover { color: #fc5e48; }
    .thumb-active { outline: 2px solid #2c2c2c; outline-offset: 2px; }
  </style>
</head>
<body class="bg-white text-ink text-base antialiased">

  <!-- Header (matches home) -->
  <header class="border-b border-line sticky top-0 z-50 bg-white/95 backdrop-blur-sm">
    <div class="max-w-[1920px] mx-auto px-5 lg:px-[90px]">
      <div class="grid grid-cols-3 items-center min-h-[88px]">
        <nav class="hidden lg:flex items-center gap-8 text-[18px] capitalize">
          <a href="index.html" class="nav-link">Home</a>
          <a href="index.html" class="nav-link">Shop</a>
          <a href="#" class="nav-link">Women</a>
          <a href="#" class="nav-link">Men</a>
          <a href="product.html?id=1" class="nav-link text-accent">Product</a>
        </nav>
        <div class="flex justify-center py-4">
          <a href="index.html">
            <img src="https://lusion.arrowtheme.com/fashion-store/wp-content/uploads/sites/6/2024/08/logo.png.webp" alt="Lusion" class="h-12 w-auto" />
          </a>
        </div>
        <div class="flex justify-end items-center gap-4 lg:gap-6 text-[18px]">
          <nav class="hidden xl:flex items-center gap-8 capitalize">
            <a href="#" class="nav-link">Pages</a>
            <a href="#" class="nav-link">Elements</a>
            <a href="#" class="nav-link">Blog</a>
          </nav>
          <button type="button" class="p-1 hover:text-accent" aria-label="Search">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z"/></svg>
          </button>
          <button type="button" class="p-1 hover:text-accent relative" aria-label="Wishlist">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="1.5" d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"/></svg>
          </button>
          <button type="button" class="p-1 hover:text-accent" aria-label="Account">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </button>
          <button type="button" class="p-1 hover:text-accent relative" aria-label="Cart">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2 9m12-9l2 9m-8-4h.01"/></svg>
            <span class="absolute -top-1 -left-1 bg-ink text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">0</span>
          </button>
          <span class="hidden md:inline text-sm text-muted border rounded-full px-3 py-1">USD, $</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Page title + breadcrumb -->
  <div class="border-b border-line py-10 lg:py-14 text-center">
    <div class="max-w-[1920px] mx-auto px-5 lg:px-[90px]">
      <h2 class="text-[30px] lg:text-[34px] font-normal mb-4">Product</h2>
      <nav id="breadcrumb-top" class="text-sm text-muted flex flex-wrap justify-center gap-x-2 gap-y-1"></nav>
    </div>
  </div>

  <main class="max-w-[1920px] mx-auto px-5 lg:px-[90px] py-10 lg:py-16">
    <div class="grid lg:grid-cols-12 gap-10 lg:gap-14">
      <!-- Gallery -->
      <div class="lg:col-span-7 flex flex-col-reverse lg:flex-row gap-4 lg:gap-6">
        <div id="thumbnails" class="flex lg:flex-col gap-3 overflow-x-auto lg:overflow-visible shrink-0"></div>
        <div class="flex-1 min-w-0 bg-neutral-50">
          <img id="main-image" src="" alt="" class="w-full h-auto object-contain max-h-[720px] mx-auto" />
        </div>
      </div>

      <!-- Summary -->
      <div class="lg:col-span-5">
        <nav id="breadcrumb-inline" class="text-sm text-muted mb-6 flex flex-wrap gap-x-2"></nav>
        <h1 id="product-name" class="text-[28px] lg:text-[34px] font-normal leading-tight"></h1>
        <p id="product-price" class="text-xl mt-4"></p>

        <div class="mt-8 flex flex-wrap items-center gap-3">
          <div class="flex items-center border border-line">
            <button type="button" id="qty-minus" class="px-4 py-3 text-muted hover:text-ink" aria-label="Decrease quantity">−</button>
            <input id="qty-input" type="number" value="1" min="1" class="w-12 text-center border-x border-line py-3 outline-none" />
            <button type="button" id="qty-plus" class="px-4 py-3 text-muted hover:text-ink" aria-label="Increase quantity">+</button>
          </div>
          <button type="button" class="flex-1 min-w-[140px] px-8 py-3 bg-ink text-white hover:bg-accent transition-colors">Add to cart</button>
          <button type="button" class="p-3 border border-line hover:border-accent hover:text-accent" aria-label="Wishlist">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="1.5" d="M12 21l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.18L12 21z"/></svg>
          </button>
          <button type="button" class="p-3 border border-line hover:border-accent hover:text-accent" aria-label="Compare">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M4 4v5h5M20 20v-5h-5M20 8a8 8 0 00-14.9-3M4 16a8 8 0 0014.9 3"/></svg>
          </button>
        </div>

        <div id="short-description" class="mt-8 text-muted leading-relaxed space-y-4"></div>

        <p class="mt-6 text-sm"><strong class="text-ink font-medium">Availability:</strong> <span id="stock" class="text-muted"></span></p>

        <div class="mt-6 flex flex-wrap items-center gap-4 text-sm">
          <span class="font-medium">Share on:</span>
          <a href="#" class="text-muted hover:text-accent">Facebook</a>
          <a href="#" class="text-muted hover:text-accent">Twitter</a>
          <a href="#" class="text-muted hover:text-accent">Pinterest</a>
        </div>

        <p id="categories" class="mt-6 text-sm text-muted leading-relaxed"></p>

        <div class="mt-10 border-t border-line pt-6">
          <details open class="group">
            <summary class="cursor-pointer list-none flex justify-between items-center text-lg font-normal">
              Details
              <span class="text-muted group-open:rotate-180 transition-transform">▾</span>
            </summary>
            <div id="details-body" class="mt-4 text-muted leading-relaxed"></div>
          </details>
        </div>
      </div>
    </div>

    <!-- Related products -->
    <section class="mt-20 lg:mt-28 border-t border-line pt-14">
      <h2 class="text-[26px] lg:text-[30px] font-normal mb-10 text-center lg:text-left">Related Products</h2>
      <div id="related-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-6 lg:gap-8"></div>
    </section>
  </main>

  <!-- Sticky bar (layout) -->
  <div class="hidden lg:block fixed bottom-0 left-0 right-0 z-40 border-t border-line bg-white shadow-[0_-4px_20px_rgba(0,0,0,0.06)] translate-y-full opacity-0 pointer-events-none" id="sticky-bar">
    <div class="max-w-[1920px] mx-auto px-[90px] py-4 flex items-center justify-between gap-6">
      <div class="flex items-center gap-4 min-w-0">
        <img id="sticky-thumb" src="" alt="" class="w-14 h-[75px] object-cover shrink-0" />
        <div class="min-w-0">
          <p id="sticky-name" class="font-normal truncate"></p>
          <p id="sticky-price" class="text-muted text-sm"></p>
        </div>
      </div>
      <div class="flex items-center gap-3 shrink-0">
        <div class="flex items-center border border-line">
          <span class="px-3 py-2 text-muted">−</span>
          <span class="px-3 py-2 border-x border-line">1</span>
          <span class="px-3 py-2 text-muted">+</span>
        </div>
        <button type="button" class="px-8 py-2.5 bg-ink text-white hover:bg-accent">Add to cart</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-line bg-white mt-8">
    <div class="max-w-[1920px] mx-auto px-5 lg:px-[90px] py-6 flex flex-col sm:flex-row justify-between gap-4 text-sm text-muted">
      <a href="index.html" class="hover:text-accent">← Back to shop</a>
      <p>©2026 Lusion — Fashion Store Demo</p>
    </div>
  </footer>

  <script>
    var IMG = "https://lusion.arrowtheme.com/fashion-store/wp-content/uploads/sites/6/2020/10/";
    var IMG12 = "https://lusion.arrowtheme.com/fashion-store/wp-content/uploads/sites/6/2020/12/";

    var products = {
      "1": {
        name: "Short straight coat",
        price: "410.00$",
        stock: "Out of stock",
        colour: "Beige / Black",
        style: "CT4100-1",
        category: "Clothing",
        subcategory: "Jacket",
        categories: "Clothing, Handmade, Jacket",
        images: [
          IMG + "Layer-134-750x1000.jpg",
          IMG12 + "coat1-4-750x1000.jpg",
          IMG + "product-lookbook-648x864.png"
        ],
        short: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen.",
        details: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen."
      },
      "2": {
        name: "Bershka puffer gilet",
        price: "320.23$",
        stock: "In Stock",
        colour: "Olive / Navy",
        style: "BK-8821",
        category: "Clothing",
        subcategory: "Men's Clothes",
        categories: "Clothing, Brand, Minimalist",
        images: [
          IMG + "Layer-141-750x1000.jpg",
          IMG + "Layer-133-1-648x864.jpg",
          IMG + "product-lookbook-v23-750x1000.jpg"
        ],
        short: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen.",
        details: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen."
      },
      "3": {
        name: "Billie Eilish M62",
        price: "234.00$",
        stock: "In Stock",
        colour: "Green moss/White/Gray",
        style: "CT5062-100",
        category: "Clothing",
        subcategory: "Men's Clothes",
        categories: "Clothing, Accessories, Minimalist",
        images: [
          IMG + "Layer-14-2-750x1000.jpg",
          IMG + "Layer-142-648x864.jpg",
          "https://lusion.arrowtheme.com/demo-minimalist/wp-content/uploads/sites/9/2020/10/minimalist-img-12.jpg",
          "https://lusion.arrowtheme.com/demo-minimalist/wp-content/uploads/sites/9/2020/10/minimalist-img-121.jpg"
        ],
        short: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen.",
        details: "Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum has been the industry's standard dummy text ever since the 1500s, when an unknown printer took a galley of type and scrambled it to make a type specimen."
      }
    };

    var related = [
      { id: "1", name: "Short straight coat", price: "410.00$", image: IMG + "Layer-134-750x1000.jpg" },
      { id: "2", name: "Bershka puffer gilet", price: "320.23$", image: IMG + "Layer-141-750x1000.jpg" },
      { id: "3", name: "Billie Eilish M62", price: "234.00$", image: IMG + "Layer-14-2-750x1000.jpg" },
      { id: "2", name: "Bershka puffer gilet", price: "320.23$", image: IMG + "product-lookbook-v23-750x1000.jpg" }
    ];

    function breadcrumbHtml(product, includeName) {
      var parts = [
        '<a href="index.html" class="hover:text-accent">Home</a>',
        '<span>/</span>',
        '<a href="index.html" class="hover:text-accent">' + product.category + '</a>',
        '<span>/</span>',
        '<a href="index.html" class="hover:text-accent">' + product.subcategory + '</a>'
      ];
      if (includeName) {
        parts.push('<span>/</span>');
        parts.push('<span class="text-ink">' + product.name + '</span>');
      }
      return parts.join(' ');
    }

    function setMainImage(src, thumbBtn) {
      document.getElementById("main-image").src = src;
      document.querySelectorAll(".thumb-btn").forEach(function (el) {
        el.classList.remove("thumb-active");
      });
      if (thumbBtn) thumbBtn.classList.add("thumb-active");
    }

    var params = new URLSearchParams(window.location.search);
    var id = params.get("id");
    if (!id || !products[id]) id = "1";
    var product = products[id];

    document.title = product.name + " — Lusion";
    document.getElementById("product-name").textContent = product.name;
    document.getElementById("product-price").textContent = product.price;
    document.getElementById("stock").textContent = product.stock;
    document.getElementById("breadcrumb-top").innerHTML = breadcrumbHtml(product, true);
    document.getElementById("breadcrumb-inline").innerHTML = breadcrumbHtml(product, false);
    document.getElementById("categories").innerHTML = "<strong class=\"text-ink\">Categories:</strong> " + product.categories;
    document.getElementById("short-description").innerHTML =
      "<p>" + product.short + "</p><ul class=\"list-disc pl-5 space-y-1\"><li>Colour Shown: " + product.colour + "</li><li>Style: " + product.style + "</li></ul>";
    document.getElementById("details-body").textContent = product.details;

    document.getElementById("main-image").src = product.images[0];
    document.getElementById("main-image").alt = product.name;

    var thumbsEl = document.getElementById("thumbnails");
    product.images.forEach(function (src, i) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "thumb-btn shrink-0 w-[72px] lg:w-[92px] " + (i === 0 ? "thumb-active" : "");
      btn.innerHTML = '<img src="' + src + '" alt="" class="w-full aspect-[152/205] object-cover" />';
      btn.addEventListener("click", function () { setMainImage(src, btn); });
      thumbsEl.appendChild(btn);
    });

    document.getElementById("qty-minus").addEventListener("click", function () {
      var input = document.getElementById("qty-input");
      var v = parseInt(input.value, 10) || 1;
      if (v > 1) input.value = v - 1;
    });
    document.getElementById("qty-plus").addEventListener("click", function () {
      var input = document.getElementById("qty-input");
      input.value = (parseInt(input.value, 10) || 1) + 1;
    });

    var relatedEl = document.getElementById("related-grid");
    var currentId = id;
    related.filter(function (r) { return r.id !== currentId; }).slice(0, 4).concat(related.filter(function (r) { return r.id === currentId; })).slice(0, 4);
    var shown = [];
    related.forEach(function (r) {
      if (shown.length >= 4) return;
      if (r.id === currentId && shown.length > 0) return;
      shown.push(r);
    });
    while (shown.length < 4) {
      related.forEach(function (r) {
        if (shown.length >= 4) return;
        if (!shown.some(function (s) { return s.id === r.id && s.image === r.image; })) shown.push(r);
      });
      if (shown.length < 4) break;
    }

    shown.slice(0, 4).forEach(function (r) {
      var card = document.createElement("article");
      card.className = "group";
      card.innerHTML =
        '<a href="product.html?id=' + r.id + '" class="block aspect-[3/4] overflow-hidden bg-neutral-100 mb-4">' +
        '<img src="' + r.image + '" alt="' + r.name + '" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />' +
        '</a>' +
        '<h3 class="text-lg font-normal"><a href="product.html?id=' + r.id + '" class="hover:text-accent">' + r.name + '</a></h3>' +
        '<p class="text-muted mt-1">' + r.price + '</p>' +
        '<p class="mt-2 text-sm border-b border-neutral-300 inline-block text-muted">Add to cart</p>';
      relatedEl.appendChild(card);
    });

    document.getElementById("sticky-thumb").src = product.images[0];
    document.getElementById("sticky-name").textContent = product.name;
    document.getElementById("sticky-price").textContent = product.price;

    var sticky = document.getElementById("sticky-bar");
    window.addEventListener("scroll", function () {
      if (window.scrollY > 600) {
        sticky.classList.remove("translate-y-full", "opacity-0", "pointer-events-none");
      } else {
        sticky.classList.add("translate-y-full", "opacity-0", "pointer-events-none");
      }
    });
  </script>
</body>
</html>
